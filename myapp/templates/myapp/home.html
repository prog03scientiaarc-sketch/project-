<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Items</title>
</head>
<body>
    <main>
        <h1>Items</h1>
        {% if items %}
            <ul>
                {% for item in items %}
                    <li>
                        {% if item.image %}
                            <img src="{{ item.image.url }}" alt="{{ item.name }}" width="200">
                        {% else %}
                            <span>No image</span>
                        {% endif %}
                        <h2>{{ item.name }}</h2>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No items found yet.</p>
        {% endif %}
    </main>
</body>
</html>
